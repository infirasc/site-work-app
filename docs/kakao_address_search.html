<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주소 검색</title>
<style>
  body { margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
  #kakao-postcode-embed { width: 100%; height: 460px; }
</style>
</head>
<body>
<div id="kakao-postcode-embed"></div>
<script>
function initKakaoPostcode() {
  new kakao.Postcode({
    oncomplete: function (data) {
      var fullAddress = data.address;
      var extra = '';
      if (data.addressType === 'R') {
        if (data.bname !== '') extra += data.bname;
        if (data.buildingName !== '') extra += (extra !== '' ? ', ' + data.buildingName : data.buildingName);
        if (extra !== '') fullAddress += ' (' + extra + ')';
      }
      var input = window.parent.document.querySelector("input[aria-label='주소']");
      if (input) {
        // focus를 먼저 줘야 Streamlit이 "진짜 사용자가 입력했다"고 인식하고 값을 백엔드로
        // 반영한다 — focus 없이 값만 바꾸고 blur()만 호출하면 화면엔 보여도 Streamlit
        // 세션 상태(파이썬 쪽)에는 반영이 안 되는 문제가 있었음.
        input.focus();
        var setter = Object.getOwnPropertyDescriptor(window.parent.HTMLInputElement.prototype, 'value').set;
        setter.call(input, fullAddress);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
        input.blur();
      }
    },
    width: '100%',
    height: '100%'
  }).embed(document.getElementById('kakao-postcode-embed'));
}
</script>
<script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" onload="initKakaoPostcode()"></script>
</body>
</html>
