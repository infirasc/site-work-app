<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주소 검색</title>
<style>
  body { margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
  #kakao-postcode-embed { width: 100%; height: 460px; }
</style>
</head>
<body>
<div id="kakao-postcode-embed"></div>
<script>
function initKakaoPostcode() {
  new kakao.Postcode({
    oncomplete: function (data) {
      var fullAddress = data.address;
      var extra = '';
      if (data.addressType === 'R') {
        if (data.bname !== '') extra += data.bname;
        if (data.buildingName !== '') extra += (extra !== '' ? ', ' + data.buildingName : data.buildingName);
        if (extra !== '') fullAddress += ' (' + extra + ')';
      }
      // 이 페이지는 GitHub Pages(다른 origin)에 있어서 Streamlit 앱의
      // window.parent.document에 직접 접근할 수 없다(SecurityError) — 값만
      // postMessage로 건네고, 입력칸 반영은 같은 origin에서 도는 Streamlit 쪽
      // 스크립트(app/streamlit_app.py)가 받아서 처리한다.
      window.parent.postMessage({ type: 'kakao-address-complete', address: fullAddress }, '*');
    },
    width: '100%',
    height: '100%'
  }).embed(document.getElementById('kakao-postcode-embed'));
}
</script>
<script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" onload="initKakaoPostcode()"></script>
</body>
</html>
